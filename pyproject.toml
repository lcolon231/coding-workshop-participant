# Tooling configuration only. This is deliberately NOT a build backend: nothing
# here is packaged or installed. `pythonpath` below is what lets the test suite
# import `acme_core` from its source of truth rather than a synced copy.

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
# Source of truth first. Tests must never exercise backend/auth/acme_core (the
# rsynced build artifact) or they could pass against a stale copy.
# "." makes tools/ importable, so the dev server has a test.
pythonpath = ["backend/_shared", "backend/auth", "backend/incidents", "."]
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
    # unit/ and integration/ both contain same-named files; prepend mode collides.
    "--import-mode=importlib",
    # Cloud tests need a deployed environment; opt in with `-m cloud`.
    "-m", "not cloud",
]
markers = [
    "unit: no I/O; a guard fixture makes create_engine raise",
    "integration: needs a real throwaway PostgreSQL database",
    "e2e: drives a real uvicorn process over HTTP",
    "cloud: runs against a deployed environment; needs API_BASE_URL; deselected by default",
]
filterwarnings = [
    # Deprecations in our own code are failures, not notes. This is what catches
    # SQLAlchemy 2.0 and Pydantic v2 removals before they become breakage.
    "error",
    # Third-party only, matched on message so it cannot hide our own warnings:
    # starlette's TestClient reaches anyio through a deprecated alias.
    "ignore:The anyio.abc.BlockingPortal alias is deprecated:DeprecationWarning",
    "ignore::DeprecationWarning:mangum.*",
]
xfail_strict = true

[tool.coverage.run]
# Packages, never "backend/auth" -- that directory holds vendored dependencies
# at build time and would inflate the denominator into meaninglessness.
source = ["acme_core", "auth_service", "incidents_service"]
branch = true
parallel = true
relative_files = true
omit = [
    # Verified by executing upgrade/downgrade in test_migrations.py, not by line count.
    "*/migrations/*",
    # Generated by tools/sync-shared.sh; three assignments, nothing to test.
    "*/acme_core/_build_stamp.py",
    # Vendored rsync copies; the source of truth is backend/_shared, which
    # pythonpath resolves first, so these are defensive only.
    #
    # Listed per service ON PURPOSE. A glob is a trap here: "backend/*/acme_core/*"
    # also matches backend/_shared/acme_core and omits the source of truth, and
    # the character-class form "backend/[!_]*/acme_core/*" makes coverage collect
    # nothing at all -- both fail silently as "No data to report", never as an
    # error. Add one line per new service.
    "backend/auth/acme_core/*",
    "backend/incidents/acme_core/*",
]

[tool.coverage.paths]
source = ["backend/_shared/acme_core", "*/backend/_shared/acme_core", "*/acme_core"]

[tool.coverage.report]
# RATCHET: raised every commit, never introduced at the end. A gate added at
# the end is a padding sprint; a gate that only moves up is a design constraint.
# commit 1: 0 (no code)  commit 2: 95  commit 3: 97  commit 4: 98
fail_under = 98
show_missing = true
skip_covered = false
exclude_also = [
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "@(abc\\.)?abstractmethod",
    "if __name__ == .__main__.:",
]

[tool.ruff]
target-version = "py313"
line-length = 100
src = ["backend/_shared", "backend/auth", "backend/incidents", "tests", "."]
extend-exclude = [
    # Repo-provided reference code. Not ours to restyle, and changing it would
    # diverge from upstream for no benefit.
    "backend/_examples",
    # Vendored build artifacts; linting them duplicates every finding.
    "backend/*/acme_core",
]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "S", "ANN", "D"]
# S101 (assert) is allowed in tests only -- see per-file-ignores. In application
# code a bare assert is stripped by python -O and trips bandit B101.
ignore = ["D203", "D213", "ANN401"]

[tool.ruff.lint.per-file-ignores]
# S101: assert is the point of a test. S105-S107: literal credentials in
# test data are fixtures, not secrets. D/ANN: docstrings and annotations
# are enforced on application code, not on every test function.
"tests/*" = ["S101", "S105", "S106", "S107", "D", "ANN"]

[tool.ruff.lint.pydocstyle]
convention = "google"
