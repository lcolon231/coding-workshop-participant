proxy:
  service:
    type: ClusterIP

hub:
  config:
    JupyterHub:
      authenticator_class: ldapauthenticator.LDAPAuthenticator
    LDAPAuthenticator:
      server_address: "corp.codingworkshop.net"
      server_port: 389
      server_args:
        get_info: "ALL"
      # StartTLS on 389 before the bind, so participants' AD passwords never
      # cross the network in the clear. The domain controllers must present a
      # certificate (server-side LDAPS on AWS Managed Microsoft AD); the bind
      # fails closed if they do not. To also verify that certificate, add
      #   tls_kwargs: { ca_certs_file: "<path>", validate: 2 }
      # and point server_address at the directory's DNS name, not an IP.
      tls_strategy: "before_bind"
      user_attribute: "sAMAccountName"
      bind_dn_template:
        - "CN={username},OU=Users,OU=CORP,DC=corp,DC=codingworkshop,DC=net"
  db:
    type: sqlite-memory

singleuser:
  image:
    name: jupyter/all-spark-notebook
    tag: latest
  cpu:
    limit: 2
    guarantee: 1
  memory:
    limit: 2Gi
    guarantee: 1Gi
  storage:
    type: "none"
    extraVolumes:
      - name: scratch-volume
        emptyDir: {}
    extraVolumeMounts:
      - name: scratch-volume
        mountPath: /var/run/jupyter

scheduling:
  userScheduler:
    enabled: true
  podPriority:
    enabled: true
  userPlaceholder:
    enabled: true
    replicas: 1
