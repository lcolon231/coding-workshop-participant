# Host-only Alembic configuration, for `alembic revision --autogenerate`.
#
# Deliberately placed ABOVE acme_core/ so tools/sync-shared.sh -- which copies
# the package directory -- never carries it into a service, and Terraform never
# zips it. At runtime the Config is built programmatically by
# acme_core.db.migrate, which needs no ini file at all.
#
# Run from the repo root:
#   make revision M="add widgets"

[alembic]
# %(here)s is the directory of THIS file. A bare relative path would resolve
# against the current working directory, so `make revision` from the repo
# root would fail to find the scripts folder.
script_location = %(here)s/acme_core/migrations
prepend_sys_path = %(here)s
path_separator = os
# Sortable, and the revision id stays greppable.
file_template = %%(year)d%%(month).2d%%(day).2d_%%(rev)s_%%(slug)s

# No sqlalchemy.url here on purpose. env.py always derives the URL from
# acme_core.config so a migration cannot be pointed at the wrong database by
# editing a file that is easy to forget.

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
